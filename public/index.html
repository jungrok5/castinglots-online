<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>성경의 제비뽑기 · 온라인 제비뽑기</title>
  <meta name="description" content="잠언 16:33 — 각자 제비(돌)를 고르고 던지는 순간 결과가 드러나는 무료 온라인 제비뽑기. 링크를 카톡·팀즈로 공유하세요. 데이터베이스 없이 동작합니다." />
  <meta name="theme-color" content="#c9a14a" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-512.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="성경의 제비뽑기" />
  <meta property="og:title" content="성경의 제비뽑기" />
  <meta property="og:description" content="각자 제비를 고르고 던지는 순간 결과가 드러나는 무료 온라인 제비뽑기. 링크 공유 · 3D 연출 · DB 없음." />
  <meta property="og:image" content="/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="ko_KR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="성경의 제비뽑기" />
  <meta name="twitter:description" content="각자 제비를 고르고 던지는 순간 결과가 드러나는 무료 온라인 제비뽑기. 링크 공유 · 3D 연출 · DB 없음." />
  <meta name="twitter:image" content="/og.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <h1>🪧 성경의 제비뽑기</h1>
    <p class="sub">“제비는 사람이 뽑으나 모든 일을 작정하기는 여호와께 있느니라” <span class="ref">— 잠언 16:33</span></p>
    <p class="sub">방을 만들고 링크를 카톡·팀즈로 나누세요. 각자 제비(돌)를 고르면, 던지는 순간 결과가 드러납니다.</p>

    <div class="card">
      <label for="title">제목 (선택)</label>
      <input id="title" type="text" placeholder="예: 오늘의 제비뽑기" maxlength="40" />

      <label class="mt">제비 수 (참가 인원)</label>
      <div class="stepper">
        <button type="button" id="minus" aria-label="줄이기">−</button>
        <div class="count" id="lotCount">4</div>
        <button type="button" id="plus" aria-label="늘리기">＋</button>
      </div>
      <p class="hint">2 ~ <span id="maxLots">12</span>개. 결과 개수는 제비 수와 같습니다.</p>

      <label class="mt">각 제비에 숨길 결과 (자유 입력)</label>
      <div id="results" class="results"></div>

      <label class="check mt">
        <input type="checkbox" id="revealNow" />
        <span>결과를 로비에서 미리 보여주기 <small>(기본은 던질 때까지 숨김)</small></span>
      </label>

      <button class="block mt" id="create">제비 준비하기</button>
      <div class="err" id="err"></div>
    </div>

    <div id="adMain" class="adslot"></div>

    <p class="sub center">데이터베이스 없이 동작하는 초간단 서비스 · 방은 12시간 후 자동 삭제됩니다.<br>
      <a href="/privacy">개인정보처리방침</a> · <small style="opacity:.6">build v1 · 이름 미입력 시 랜덤 닉네임</small></p>
  </div>

  <script>
    const MIN = 2, MAX = 12;
    let lotCount = 4;
    const saved = {}; // 제비 수를 바꿔도 입력값 유지 (인덱스별)

    const countEl = document.getElementById('lotCount');
    const resultsEl = document.getElementById('results');
    const err = document.getElementById('err');
    document.getElementById('maxLots').textContent = MAX;

    function captureInputs() {
      resultsEl.querySelectorAll('input').forEach((inp) => {
        saved[Number(inp.dataset.i)] = inp.value;
      });
    }
    function renderResults() {
      let html = '';
      for (let i = 0; i < lotCount; i++) {
        const v = (saved[i] || '').replace(/"/g, '&quot;');
        html += `<div class="resrow"><span class="ridx">${i + 1}</span>
          <input type="text" data-i="${i}" maxlength="24" placeholder="결과 ${i + 1} (예: 청소 / 간식 / 통과)" value="${v}" /></div>`;
      }
      resultsEl.innerHTML = html;
    }
    function setCount(n) {
      captureInputs();
      lotCount = Math.max(MIN, Math.min(MAX, n));
      countEl.textContent = lotCount;
      renderResults();
    }
    document.getElementById('minus').onclick = () => setCount(lotCount - 1);
    document.getElementById('plus').onclick = () => setCount(lotCount + 1);
    renderResults();

    const btn = document.getElementById('create');
    btn.addEventListener('click', async () => {
      captureInputs();
      btn.disabled = true; err.textContent = '';
      const results = [];
      for (let i = 0; i < lotCount; i++) results.push((saved[i] || '').trim());
      try {
        const res = await fetch('/api/rooms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: document.getElementById('title').value,
            lotCount,
            results,
            drawMode: 'pick',                                    // 각자 제비를 직접 선택
            resultsHidden: !document.getElementById('revealNow').checked, // 기본: 던질 때까지 숨김
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '생성 실패');
        // 방장 토큰은 URL 해시로 전달 → room 페이지가 localStorage에 저장
        location.href = `/r/${data.roomId}#host=${data.hostToken}`;
      } catch (e) {
        err.textContent = e.message;
        btn.disabled = false;
      }
    });
  </script>
  <script src="/ads.js"></script>
  <script>window.Ads && Ads.mount(document.getElementById('adMain'), 'main');</script>
</body>
</html>
