<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>성경의 제비뽑기 · 온라인 제비뽑기</title>
  <meta name="description" content="잠언 16:33 — 각자 제비(돌)를 고르고 던지는 순간 결과가 드러나는 무료 온라인 제비뽑기. 링크를 카톡·팀즈로 공유하세요. 데이터베이스 없이 동작합니다." />
  <meta name="theme-color" content="#c9a14a" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-512.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="성경의 제비뽑기" />
  <meta property="og:title" content="성경의 제비뽑기" />
  <meta property="og:description" content="각자 제비를 고르고 던지는 순간 결과가 드러나는 무료 온라인 제비뽑기. 링크 공유 · 3D 연출 · DB 없음." />
  <meta property="og:image" content="https://castinglots-online.onrender.com/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="ko_KR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="성경의 제비뽑기" />
  <meta name="twitter:description" content="각자 제비를 고르고 던지는 순간 결과가 드러나는 무료 온라인 제비뽑기. 링크 공유 · 3D 연출 · DB 없음." />
  <meta name="twitter:image" content="https://castinglots-online.onrender.com/og.png" />
  <link rel="stylesheet" href="/style.css" />
  <script type="importmap">
    { "imports": { "three": "/vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div class="wrap">
    <h1 id="title">제비뽑기</h1>
    <p class="sub" id="subtitle"></p>
    <div id="app"></div>
    <div id="adResult" class="adslot"></div>
    <div class="err" id="err"></div>
    <div class="gamenav">
      <span class="gnav-label">🎮 함께 즐기는 게임</span>
      <div class="gchips">
        <a class="gchip" href="https://gbb-online.onrender.com/">✊ 가위바위보</a>
        <a class="gchip" href="https://ladder-online.onrender.com/">🪜 사다리타기</a>
        <span class="gchip current">🪧 제비뽑기</span>
      </div>
    </div>
    <p class="sub center mt"><a href="/">새 방 만들기</a> · <a href="/privacy">개인정보처리방침</a></p>
  </div>
  <div class="toast" id="toast"></div>

  <script src="/ads.js"></script>
  <script>
    const roomId = location.pathname.split('/').pop();

    // 방장 토큰: 생성 직후 URL 해시로 도착 → localStorage 저장 후 해시 제거
    const hostKey = `lots_host_${roomId}`;
    const playerKey = `lots_player_${roomId}`;
    if (location.hash.startsWith('#host=')) {
      localStorage.setItem(hostKey, location.hash.slice(6));
      history.replaceState(null, '', `/r/${roomId}`);
    }
    const hostToken = localStorage.getItem(hostKey);
    let me = JSON.parse(localStorage.getItem(playerKey) || 'null'); // {playerId, name, lot}

    const app = document.getElementById('app');
    const errEl = document.getElementById('err');
    let lastSig = '';
    let revealing = false;     // 연출 중에는 하단 렌더 보류
    let playedReveal = false;  // 이번 게임 연출을 이미 재생했는지
    let latestState = null;
    const myId = () => me && me.playerId;

    function showErr(msg) { errEl.textContent = msg || ''; }
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800);
    }
    async function api(action, body) {
      const res = await fetch(`/api/rooms/${roomId}${action}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '요청 실패');
      return data;
    }
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    // ---------------- 렌더링 ----------------
    function render(s) {
      document.getElementById('title').textContent = s.title;
      document.getElementById('subtitle').textContent =
        s.status === 'lobby' ? `${s.lotCount}개의 제비 · 각자 하나를 고르세요`
        : (s.status === 'finished' ? '제비를 다 뽑았습니다 — 결과를 확인하세요' : '제비를 던지는 중…');
      const isHost = !!hostToken;
      let html = '';
      if (s.status === 'lobby') html += lobbyView(s, isHost);
      else html += finishedView(s, isHost);
      app.innerHTML = html;
      wire(s, isHost);
      // 결과 화면에서만 광고 노출 (로비/연출 중에는 비움 → :empty 로 숨김)
      const adEl = document.getElementById('adResult');
      if (adEl && window.Ads) { if (s.status === 'finished') Ads.mount(adEl, 'result'); else Ads.clear(adEl); }
      window.L3D && window.L3D.sync(s, myId());
    }

    function shareCard() {
      const link = location.origin + '/r/' + roomId;
      return `<div class="card">
        <label>친구에게 보낼 링크 (카톡·팀즈에 붙여넣기)</label>
        <div class="share">
          <input type="text" id="shareLink" readonly value="${link}" />
          <button id="copyBtn">복사</button>
        </div>
      </div>`;
    }

    function lobbyView(s, isHost) {
      const taken = {};
      s.players.forEach(p => { if (p.lot != null) taken[p.lot] = p.name; });
      let html = shareCard();
      html += `<div class="card"><p class="sub" style="margin:2px 0 10px">${s.players.length}/${s.lotCount}명 참가 · 빈 제비를 눌러 선택하세요</p>`;

      if (!me) {
        html += `<div class="mb"><label for="nameInput">이름</label>
          <input type="text" id="nameInput" placeholder="이름을 입력하세요 (비우면 랜덤)" maxlength="20" /></div>`;
      }

      html += `<div class="lots">`;
      for (let i = 0; i < s.lotCount; i++) {
        const occupant = taken[i];
        const mine = me && occupant === me.name && me.lot === i;
        const cls = occupant ? (mine ? 'lot mine' : 'lot taken') : 'lot free';
        const who = occupant ? escapeHtml(occupant) + (mine ? ' (나)' : '') : '비어있음';
        // 결과는 공개 방일 때만 표시(숨김이면 던질 때까지 비밀)
        const res = s.results ? `🎁 ${escapeHtml(s.results[i])}` : '🔒 비밀';
        html += `<button type="button" class="${cls}" data-lot="${i}" ${occupant ? 'disabled' : ''}>
          <span class="lstone">🪨</span>
          <span class="lnum">${i + 1}번 제비</span>
          <span class="lwho">${who}</span>
          <span class="lres">${res}</span>
        </button>`;
      }
      html += `</div>`;

      if (me) html += `<p class="status mt">${me.lot != null ? `내 제비: <b>${me.lot + 1}번</b> · ` : ''}방장이 시작하기를 기다리는 중…</p>`;
      else html += `<p class="status mt">이름을 입력하고 원하는 제비를 누르세요.</p>`;

      if (isHost) {
        const ok = s.players.length >= 1;
        html += `<button class="block mt" id="startBtn" ${ok ? '' : 'disabled'}>🎲 제비 던지기 ${ok ? '' : '(1명 이상 필요)'}</button>`;
      }
      html += `</div>`;
      return html;
    }

    function resultFor(s, lot) {
      if (!s.mapping || !s.results || lot == null) return null;
      return s.results[s.mapping[lot]];
    }

    function finishedView(s, isHost) {
      let html = `<div class="card">
        <div class="big">📜 제비뽑기 결과</div>
        <ul class="outcome">`;
      const rows = s.players.map(p => ({ name: p.name, lot: p.lot, res: resultFor(s, p.lot) }));
      rows.sort((a, b) => (a.lot ?? 0) - (b.lot ?? 0));
      for (const r of rows) {
        const mineCls = (me && r.name === me.name) ? ' minerow' : '';
        html += `<li class="${mineCls}"><span class="oname">${escapeHtml(r.name)}<small> · ${r.lot + 1}번 제비</small></span>
          <span class="ores">${escapeHtml(r.res ?? '?')}</span></li>`;
      }
      html += `</ul>`;
      html += `<p class="sub center" style="margin:10px 0 0">“제비는 사람이 뽑으나 모든 일을 작정하기는 여호와께 있느니라” <span class="ref">— 잠언 16:33</span></p>`;
      if (isHost) html += `<button class="block mt" id="resetBtn">🔀 다시 뽑기 (같은 멤버)</button>`;
      html += `</div>`;
      return html;
    }

    // ---------------- 이벤트 연결 ----------------
    function wire(s, isHost) {
      const copyBtn = document.getElementById('copyBtn');
      if (copyBtn) copyBtn.onclick = () => {
        const inp = document.getElementById('shareLink');
        const text = `${s.title}\n${inp.value}`;
        const fallback = () => { inp.select(); document.execCommand('copy'); };
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(() => toast('제목과 링크 복사됨!')).catch(() => { fallback(); toast('복사됨!'); });
        } else { fallback(); toast('복사됨!'); }
      };

      document.querySelectorAll('.lot.free').forEach(btn => {
        btn.onclick = async () => {
          if (me) return;
          showErr('');
          const nameEl = document.getElementById('nameInput');
          const name = nameEl ? nameEl.value.trim() : '';
          const lot = Number(btn.dataset.lot);
          try {
            const d = await api('/join', { name, lot });
            me = { playerId: d.playerId, name: d.name, lot: d.lot };
            localStorage.setItem(playerKey, JSON.stringify(me));
            lastSig = ''; poll();
          } catch (e) { showErr(e.message); }
        };
      });

      const startBtn = document.getElementById('startBtn');
      if (startBtn) startBtn.onclick = async () => {
        showErr('');
        try { await api('/start', { hostToken }); lastSig = ''; poll(); }
        catch (e) { showErr(e.message); }
      };

      const resetBtn = document.getElementById('resetBtn');
      if (resetBtn) resetBtn.onclick = async () => {
        try { await api('/reset', { hostToken }); playedReveal = false; lastSig = ''; poll(); }
        catch (e) { showErr(e.message); }
      };
    }

    // ---------------- 연출 ----------------
    function playReveal(s) {
      revealing = true;
      document.body.classList.add('revealing');
      let done = false;
      const cleanup = () => {
        if (done) return; done = true;
        clearTimeout(failsafe);
        document.querySelectorAll('.reveal2d, .flashbang').forEach((el) => el.remove());
        try { window.L3D && window.L3D.endReveal(); } catch (e) {}
        document.body.classList.remove('revealing');
        revealing = false; lastSig = '';
        // 연출이 끝났으니 서버 상태를 finished 로 (멱등)
        api('/finish', {}).catch(() => {});
        if (latestState) { latestState.status = 'finished'; render(latestState); }
        poll();
      };
      const failsafe = setTimeout(cleanup, 20000);

      if (window.L3D && window.L3D.ready) {
        try { window.L3D.reveal(s, myId(), cleanup); return; }
        catch (e) { /* 3D 실패 → 2D 폴백 */ }
      }
      reveal2D(s, cleanup);
    }

    // 2D 폴백 연출: 제비(돌)를 하나씩 뒤집어 결과를 공개한다. 내 제비는 맨 마지막.
    function reveal2D(s, onDone) {
      if (!s.mapping || !s.results) { onDone(); return; }
      const overlay = document.createElement('div');
      overlay.className = 'reveal2d';

      // 점유된 제비만, 내 제비를 맨 뒤로 정렬(쫄깃)
      const occupied = s.players.filter(p => p.lot != null).sort((a, b) => a.lot - b.lot);
      const order = occupied.filter(p => p.id !== myId()).concat(occupied.filter(p => p.id === myId()));
      if (!order.length) { setTimeout(onDone, 400); return; }

      let html = `<div class="drum">🙏 제비를 던지나이다…</div><div class="stonebox">`;
      for (const p of occupied) {
        const res = s.results[s.mapping[p.lot]];
        html += `<div class="stone2d" data-lot="${p.lot}">
          <div class="s2d-top">${escapeHtml(p.name)}</div>
          <div class="s2d-face s2d-back">🪨</div>
          <div class="s2d-face s2d-front">${escapeHtml(res)}</div>
          <div class="s2d-num">${p.lot + 1}번</div>
        </div>`;
      }
      html += `</div>`;
      overlay.innerHTML = html;
      document.body.appendChild(overlay);

      let i = 0;
      const flipNext = () => {
        if (i >= order.length) {
          overlay.querySelector('.drum').textContent = '제비뽑기 완료! 📜';
          const flash = document.createElement('div'); flash.className = 'flashbang';
          document.body.appendChild(flash); setTimeout(() => flash.remove(), 500);
          setTimeout(onDone, 1900);
          return;
        }
        const p = order[i++];
        const card = overlay.querySelector(`.stone2d[data-lot="${p.lot}"]`);
        if (card) {
          card.classList.add('flip');
          if (p.id === myId()) card.classList.add('mine');
          if (navigator.vibrate) navigator.vibrate(30);
        }
        setTimeout(flipNext, 900);
      };
      setTimeout(flipNext, 700);
    }

    // ---------------- 폴링 ----------------
    async function poll() {
      try {
        const res = await fetch(`/api/rooms/${roomId}`);
        if (!res.ok) { const d = await res.json(); showErr(d.error); return; }
        const s = await res.json();
        latestState = s;
        window.L3D && window.L3D.sync(s, myId());

        if (s.status === 'lobby') playedReveal = false;

        if (s.status === 'revealing' && !playedReveal && s.mapping) {
          playedReveal = true;
          render(s);            // 배경 HUD를 한번 갱신(연출 중 숨겨짐)
          playReveal(s);
          return;
        }
        if (revealing) return;

        const sig = JSON.stringify([s.status, s.players.map(p => [p.name, p.lot]), s.results, !!me, s.mapping]);
        if (sig !== lastSig) { lastSig = sig; render(s); }
      } catch (e) { /* 네트워크 일시 오류 무시 */ }
    }

    window.lotsResync = () => { if (latestState) window.L3D?.sync(latestState, myId()); };

    poll();
    setInterval(poll, 1500);
  </script>

  <!-- 3D 무대 부트스트랩 (실패하면 window.L3D 미설정 → 자동 2D 폴백) -->
  <script type="module">
    import { init, sync, reveal, endReveal, charCount } from '/scene.js';
    try {
      if (init(document.getElementById('stage'))) {
        window.L3D = { ready: true, sync, reveal, endReveal, charCount };
        document.body.classList.add('has3d');
        window.lotsResync && window.lotsResync();
      }
    } catch (e) { console.warn('3D 비활성화 → 2D 폴백', e); }
  </script>
</body>
</html>
